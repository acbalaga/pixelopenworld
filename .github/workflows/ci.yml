name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run bake:check
      - run: npm run bake:world:check
      - run: npm run test
      # Fight simulator and sim bot, short versions. Fails past tools/balance-thresholds.json.
      - run: npm run balance:ci
      - run: npm run build
      - run: node tools/check-bundle.mjs
      - run: npm run check:dev
      - run: npm run check:seal
      - run: npm run check:pwa
      - run: npm run check:prod
      - run: npm run check:deps
      - run: npm run tamper -- --sample
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e-screenshots/
            playwright-report/
          if-no-files-found: warn
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
